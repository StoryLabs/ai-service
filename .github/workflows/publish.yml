name: Publish @storylabs/ai-service

# Publish to GitHub Packages when a GitHub Release is published, or on manual run.
# Uses the built-in GITHUB_TOKEN (no PAT needed) since this repo and the @storylabs
# scope share the StoryLabs owner.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@storylabs'

      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "Publishing $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION already published — skipping."
          else
            npm publish
          fi
